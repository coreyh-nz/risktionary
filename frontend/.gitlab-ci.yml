stages:
  - lint
  - build
  - deploy

variables:
  IMAGE_NAME: risktionary-frontend
  CONTAINER_NAME: risktionary-frontend

lint:
  stage: lint
  tags:
    - docker
  image: node:24-alpine
  script:
    - npm ci
    - npm run lint

build:
  stage: build
  tags:
    - shell
  script:
    - |
      docker build \
        --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
        --build-arg NEXT_PUBLIC_WS_URL=$NEXT_PUBLIC_WS_URL \
        -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
  after_script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "main" ]; then
        docker rmi $IMAGE_NAME:$CI_COMMIT_SHORT_SHA || true
      fi

deploy:
  stage: deploy
  tags:
    - shell
  only:
    - main
  script:
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 3000:3000 $IMAGE_NAME:$CI_COMMIT_SHORT_SHA