name: risktionary
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risktionary-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .test.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - risktionary_network

  database:
    image: postgres:16
    container_name: risktionary-database
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: risktionary
      POSTGRES_USER: risktionary
      POSTGRES_PASSWORD: risktionary
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U risktionary -d risktionary" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - risktionary_network

networks:
  risktionary_network:
    driver: bridge