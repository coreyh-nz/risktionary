spring:
  application:
    name: risktionary

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/v1/oauth/google/callback"
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID}
            client-secret: ${MICROSOFT_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/v1/oauth/microsoft/callback"
            authorization-grant-type: authorization_code
            client-name: Microsoft
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

  # the chat models are built from app.ai.providers, so spring's own chat auto configuration stays off
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

springdoc:
  show-oauth2-endpoints: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

app:
  frontend-url: "http://localhost:3000"
  auth:
    cookie:
      path: "/"
      secure: false
      same-site: lax
      access-token-name: risktionary_at
      login-success-redirect-url-name: risktionary_lr
  game:
    ticket:
      lifetime: 30m
    persistence:
      pending-ai-timeout: 10s
    scoring:
      max-points: 1000
      min-points: 100
      untimed-reference-window: 60s
    session:
      cleanup:
        interval: 30s
        host-join-grace-period: 60s
        host-abandoned-timeout: 5m
        stuck-starting-timeout: 2m
  ai:
    # every provider must speak the OpenAI chat completions API, see the README
    providers:
      openai:
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPENAI_API_KEY:}
      gemini:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai/
        api-key: ${GEMINI_API_KEY:}
      openrouter:
        base-url: https://openrouter.ai/api/v1
        api-key: ${OPENROUTER_API_KEY:}
      local:
        base-url: ${LOCAL_AI_BASE_URL:http://localhost:11434/v1}
        api-key: ${LOCAL_AI_API_KEY:ollama}
  feedback:
    ai:
      use-cases:
        image-analysis:
          provider: ${FEEDBACK_AI_USE_CASE_IMAGE_ANALYSIS_PROVIDER:openai}
          model: ${FEEDBACK_AI_USE_CASE_IMAGE_ANALYSIS_MODEL}
          temperature: ${FEEDBACK_AI_USE_CASE_IMAGE_ANALYSIS_TEMPERATURE:0.2}
        fact-generation:
          provider: ${FEEDBACK_AI_USE_CASE_FACT_GENERATION_PROVIDER:openai}
          model: ${FEEDBACK_AI_USE_CASE_FACT_GENERATION_MODEL}
          temperature: ${FEEDBACK_AI_USE_CASE_FACT_GENERATION_TEMPERATURE:0.3}
        fact-framing-rewrite:
          provider: ${FEEDBACK_AI_USE_CASE_FACT_FRAMING_REWRITE_PROVIDER:openai}
          model: ${FEEDBACK_AI_USE_CASE_FACT_FRAMING_REWRITE_MODEL}
          temperature: ${FEEDBACK_AI_USE_CASE_FACT_FRAMING_REWRITE_TEMPERATURE:0.4}

jwt:
  access-lifetime: 30d
  secret: ${JWT_SECRET}
