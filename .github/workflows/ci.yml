name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: risktionary-backend
  FRONTEND_IMAGE_NAME: risktionary-frontend

jobs:
  validate-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag is semver
        run: ./scripts/validate-tag.sh "${GITHUB_REF#refs/tags/}"

  deploy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck deploy/install.sh scripts/validate-tag.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare install directory
        run: |
          mkdir -p "$RUNNER_TEMP/risktionary"
          # in-memory database so the backend can start without Postgres
          cat > "$RUNNER_TEMP/risktionary/backend.env" <<EOF
          SPRING_PROFILES_ACTIVE=h2
          JWT_SECRET=ci-dummy-secret-ci-dummy-secret-ci-dummy
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          MICROSOFT_CLIENT_ID=dummy
          MICROSOFT_CLIENT_SECRET=dummy
          MICROSOFT_TENANT_ID=dummy
          EOF

      - name: Run install script (first install)
        env:
          INSTALL_DIR: ${{ runner.temp }}/risktionary
          COMPOSE_URL: file://${{ github.workspace }}/docker-compose.yml
        run: ./deploy/install.sh

      - name: Run install script (update over running containers)
        env:
          INSTALL_DIR: ${{ runner.temp }}/risktionary
          COMPOSE_URL: file://${{ github.workspace }}/docker-compose.yml
        run: ./deploy/install.sh

      - name: Show container logs
        if: always()
        run: docker compose -f "$RUNNER_TEMP/risktionary/docker-compose.yml" logs --tail 50

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: backend

      - name: Run tests
        working-directory: backend
        run: ./gradlew test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/**/*.xml
            backend/build/reports/tests/
            backend/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 7

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

  backend-build:
    needs: backend-test
    # skip the build-and-discard job on tag pushes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t $BACKEND_IMAGE_NAME:${GITHUB_SHA::8} backend

      - name: Remove image (non-main branches)
        if: github.ref != 'refs/heads/main'
        run: docker rmi $BACKEND_IMAGE_NAME:${GITHUB_SHA::8} || true

  frontend-build:
    needs: frontend-lint
    # skip the build-and-discard job on tag pushes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-publish:
    needs: [backend-test, validate-tag]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: version
        # drop the leading "v" for the docker tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}:latest

  frontend-publish:
    needs: [frontend-lint, validate-tag]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: version
        # drop the leading "v" for the docker tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
