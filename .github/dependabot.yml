version: 2
updates:
  # Backend
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

    groups:
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
          - "eslint-config-next"

      tiptap:
        patterns:
          - "@tiptap/*"

      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"

      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Workflows (root .github)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
